<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>To Do List</title>
    <style>
        .delete-btn {
            margin-left: 10px;
            background-color: #FF0000;
            color: white;
            border: none;
            padding: 2px 6px;
            cursor: pointer;
        }
    </style>
</head>
<body>
    <h1>To Do List</h1>

    <input type="text" id="taskInput" placeholder="Add a Task">
    <button onclick="addTask()">Add</button>

    <ul id="taskList"></ul>

    <script>
        function addTask() {
            const taskText = getTaskText();
            if (taskText) {
                addTaskItem(taskText);
            } else {
                console.log("No task entered");
            }
        }

        function getTaskText() {
            const input = document.getElementById("taskInput");
            const text = input.value.trim();
            console.log("getTaskText() called:", input.value);
            input.value = ""; // Clear the input after getting text
            return text;
        }

        function addTaskItem(taskText) {
            const li = document.createElement("li");
            li.textContent = taskText;

            const deleteBtn = createDeleteButton(li);
            li.appendChild(deleteBtn);

            document.getElementById("taskList").appendChild(li);
            console.log("addTaskItem() called ->", taskText, Date());
        }

        function createDeleteButton(li) {
            const deleteBtn = document.createElement("button");
            deleteBtn.textContent = "X";
            deleteBtn.className = "delete-btn";
            deleteBtn.style.marginLeft = "10px";
            deleteBtn.style.backgroundColor = "#FF0000";
            deleteBtn.onclick = () => handleDeleteClick(li);

            console.log("createDeleteClick() called ->", li.textContent);
            return deleteBtn;
        }

        function handleDeleteClick(li) {
            console.log("handleDeleteClick() called ->", li.textContent.replace("X", "").trim(), Date());
            li.remove();
        }
    </script>
</body>
</html>
