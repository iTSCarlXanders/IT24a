<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>To Do List</title>
  <style>
    .done {
      text-decoration: line-through;
      color: gray;
    }
  </style>
</head>
<body>
  <h1>To Do List</h1>
  <input type="text" id="taskInput" placeholder="Add a task" />
  <button onclick="addTask()">Add</button>

  <ul id="taskList"></ul>

  <script>
    function addTask(){
      const taskText = getTaskText();
      if(taskText){
        addTaskItem(taskText);
        document.getElementById('taskInput').value = '';
      } else {
        console.log("No task entered");
      }
    }

    function getTaskText(){
      const input = document.getElementById('taskInput');
      return input.value.trim();
    }

    function addTaskItem(taskText){
      const li = document.createElement("li");
      const taskSpan = document.createElement("span");
      taskSpan.textContent = taskText;
      li.appendChild(taskSpan);

      document.getElementById("taskList").appendChild(li);

      const deleteBtn = createDeleteButton(li);
      li.appendChild(deleteBtn);

      const editBtn = createEditButton(li, taskSpan);
      li.appendChild(editBtn);

      const doneBtn = createDoneButton(taskSpan);
      li.appendChild(doneBtn);
    }

    function createDeleteButton(li){
      const deleteBtn = document.createElement("button");
      deleteBtn.textContent = "Delete";
      deleteBtn.style.marginLeft = "8px";
      deleteBtn.style.backgroundColor = "red";
      deleteBtn.onclick = () => li.remove();
      return deleteBtn;
    }

    function createEditButton(li, taskSpan){
      const editBtn = document.createElement("button");
      editBtn.textContent = "Edit";
      editBtn.style.marginLeft = "8px";
      editBtn.onclick = () => {
        const currentText = taskSpan.textContent.trim();
        const newText = prompt("Edit your task:", currentText);
        if(newText && newText.trim() !== "") taskSpan.textContent = newText.trim();
      };
      return editBtn;
    }

    function createDoneButton(taskSpan){
      const doneBtn = document.createElement("button");
      doneBtn.textContent = "Done";
      doneBtn.style.marginLeft = "8px";
      doneBtn.onclick = () => {
        taskSpan.classList.add("done");
        const li = taskSpan.parentElement;
        li.querySelectorAll("button").forEach(btn => btn.remove());
      };
      return doneBtn;
    }
  </script>
</body>
</html>
