<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Maps</title>

      <!-- Leaflet -->
  <link
    rel="stylesheet"
    href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
    integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY="
    crossorigin=""/>
    
   <!-- Make sure you put this AFTER Leaflet's CSS -->
  <script
    src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
    integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo="
    crossorigin=""
  ></script>

  <style>
    #map { height: 400px; }
        .popup-image {
            max-width: 200px;
            height: auto;
        }
  </style>
</head>

<body>
  <h1>Basic Map</h1>
  <div id="map"></div>

  <script>
 
    var map = L.map("map").setView([8.360053042057906, 124.86834154336864], 17);

   
    L.tileLayer("https://tile.openstreetmap.org/{z}/{x}/{y}.png", {
      maxZoom: 19,
      attribution:
        '&copy; <a href="http://www.openstreetmap.org/copyright">OpenStreetMap</a>',
    }).addTo(map);

   
    var marker = L.marker([8.360053042057906, 124.86834154336864]).addTo(map);


    const LebronImage = `<img src="https://www.bu.edu/files/2024/12/Screenshot-2024-12-13-at-12.42.40%E2%80%AFPM.png" class="popup-image" width="200" alt="You Are My Sunshine LeBron" />`;
    const popupContent = `${LebronImage}<br><b>You Are My Sunshine</b><br>I am a popup.`;


    marker.bindPopup(popupContent).openPopup();
  </script>
</body>
</html>
